global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: quizarena-java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
    relabel_configs:
      - source_labels: []
        target_label: service
        replacement: quizarena-java

  - job_name: quizarena-python
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
    relabel_configs:
      - source_labels: []
        target_label: service
        replacement: quizarena-python
