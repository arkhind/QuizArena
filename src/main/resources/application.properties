spring.datasource.url=jdbc:postgresql://localhost:5433/quizarena
spring.datasource.username=quizuser
spring.datasource.password=quizpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

server.port=8081

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=uploads

spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.timeout=2000ms

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
quizarena.kafka.quiz-generation.request-topic=quiz-generation-requests
quizarena.kafka.quiz-generation.request-dlt-topic=quiz-generation-requests-dlt
quizarena.kafka.quiz-generation.worker-group-id=quiz-generation-worker
quizarena.kafka.quiz-generation.request-partitions=3
quizarena.kafka.quiz-generation.worker-concurrency=3

spring.kafka.admin.enabled=true
spring.kafka.admin.auto-create=true
spring.kafka.admin.fail-fast=false

spring.kafka.listener.missing-topics-fatal=false

spring.kafka.consumer.properties.max.poll.interval.ms=1800000
spring.kafka.consumer.max-poll-records=1
spring.kafka.listener.ack-mode=record


management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=quizarena

quizarena.ml.base-url=http://127.0.0.1:8000

# JWT
# Секрет должен быть Base64-строкой длиной не менее 32 байт (256 бит) для HS256.
# Для продакшена задавайте через переменную окружения QUIZARENA_JWT_SECRET.
quizarena.jwt.secret=${QUIZARENA_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LXBsZWFzZS1jaGFuZ2UtaW4tcHJvZC0zMmJ5dGVzIQ==}
quizarena.jwt.expiration-ms=86400000
quizarena.jwt.issuer=quizarena
