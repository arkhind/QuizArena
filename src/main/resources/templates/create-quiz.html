<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>�������� ����� - QuizArena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .required {
            color: #e74c3c;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .file-upload-section {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .file-upload-section:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .file-upload-label {
            display: block;
            color: #666;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .file-upload-icon {
            font-size: 40px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .quiz-type-section {
            margin-top: 20px;
        }

        .type-category {
            margin-bottom: 20px;
        }

        .type-category-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 12px;
            display: block;
        }

        .radio-group {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .radio-option label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .number-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .number-inputs {
                grid-template-columns: 1fr;
            }

            .radio-group {
                flex-direction: column;
                gap: 15px;
            }
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            justify-content: center;
        }

        button {
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .cancel-btn {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .cancel-btn:hover {
            background: #667eea;
            color: white;
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .file-name {
            color: #28a745;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
    <link rel="stylesheet" href="/css/theme.css?v=3" onerror="this.onerror=null;this.href='../static/css/theme.css?v=3';">
</head>
<body>
<div class="form-container">
    <h1>�������� �����</h1>

    <form id="createQuizForm" onsubmit="handleSubmit(event)">
        <!-- �������� ����� -->
        <div class="form-group">
            <label>
                <span class="required">*</span> ������� ��������:
            </label>
            <input type="text"
                   id="quizName"
                   name="name"
                   required>
        </div>

        <!-- ��������/����� -->
        <div class="form-group">
            <label>
                <span class="required">*</span> �������� (������ ��� ��):
            </label>
            <textarea id="quizPrompt"
                      name="prompt"
                      required></textarea>
        </div>

        <!-- �������� ����� -->
        <div class="form-group">
            <div class="file-upload-section" id="fileUploadSection">
                <span class="file-upload-label" id="fileUploadLabel">
                    �������� �������� (.pdf, .txt, .doc, .docx)
                </span>
                <input type="file"
                       id="quizMaterial"
                       name="material"
                       accept=".pdf,.txt,.doc,.docx"
                       style="display: none;">
            </div>
            <div class="file-name" id="fileName" style="display: none;"></div>
        </div>

        <!-- �������� ��������� -->
        <div class="number-inputs">
            <div class="form-group">
                <label>
                    <span class="required">*</span> ���������� ��������:
                </label>
                <input type="number"
                       id="questionNumber"
                       name="questionNumber"
                       value="10"
                       min="1"
                       max="200"
                       required>
                <small style="color: #666; display: block; margin-top: 5px;">
                    �������� 30 �������� (�� 200 ��������� � ���� ������)
                </small>
            </div>

            <div class="form-group">
                <label>
                    <span class="required">*</span> ����� �� ����� (���):
                </label>
                <input type="number"
                       id="timeLimit"
                       name="timeLimit"
                       value="30"
                       min="1"
                       required>
            </div>
        </div>

        <!-- ��� ����� -->
        <div class="form-group quiz-type-section">
            <label>
                <span class="required">*</span> �������� ��� �����:
            </label>

            <!-- ����������� -->
            <div class="type-category">
                <span class="type-category-label">1. ���������:</span>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio"
                               id="public"
                               name="visibility"
                               value="public"
                               checked>
                        <label for="public">���������</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio"
                               id="private"
                               name="visibility"
                               value="private">
                        <label for="private">���������</label>
                    </div>
                </div>
            </div>

            <!-- ����������� -->
            <div class="type-category">
                <span class="type-category-label">2. ��� �����������:</span>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio"
                               id="static"
                               name="contentType"
                               value="static"
                               checked>
                        <label for="static">���������</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio"
                               id="updatable"
                               name="contentType"
                               value="updatable">
                        <label for="updatable">�����������</label>
                    </div>
                </div>
            </div>

            <!--��� ��������(���� defaultQuestionType � API)-->
            <div class="type-category">
                <span class="type-category-label">3. ��� ��������:</span>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="defSingle" name="defaultQuestionType" value="SINGLE_CHOICE" checked>
                        <label for="defSingle">��������� �����</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="defMulti" name="defaultQuestionType" value="MULTIPLE_CHOICE">
                        <label for="defMulti">������������� �����</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="defHundredToOne" name="defaultQuestionType" value="HUNDRED_TO_ONE">
                        <label for="defHundredToOne">100�1</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <!-- ������ -->
        <div class="button-group">
            <button type="button" class="cancel-btn" onclick="goBack()">
                ������
            </button>
            <button type="submit" class="submit-btn">
                ������� ����
            </button>
        </div>
    </form>
</div>

<script>
    function getCurrentUserId() {
        const hiddenUserId = document.getElementById('userId')?.value;
        return hiddenUserId || localStorage.getItem('userId') || '1';
    }

    function goBack() {
        window.location.href = '/my-quizzes';
    }


    document.getElementById('fileUploadSection').addEventListener('click', function() {
        document.getElementById('quizMaterial').click();
    });


    document.getElementById('quizMaterial').addEventListener('change', function(e) {
        if (e.target.files.length > 0) {
            updateFileLabel(e.target.files[0].name);
        }
    });

    function updateFileLabel(fileName) {
        const label = document.getElementById('fileUploadLabel');
        const fileNameDiv = document.getElementById('fileName');
        label.textContent = '���� ������: ' + fileName;
        fileNameDiv.textContent = fileName;
        fileNameDiv.style.display = 'block';
    }

    async function handleSubmit(event) {
        event.preventDefault();

        const form = document.getElementById('createQuizForm');
        const formData = new FormData(form);
        const errorMessage = document.getElementById('errorMessage');
        const fileInput = document.getElementById('quizMaterial');


        const quizData = {
            name: formData.get('name'),
            prompt: formData.get('prompt'),
            createdBy: parseInt(getCurrentUserId()),
            hasMaterial: fileInput.files.length > 0 && fileInput.files[0].size > 0,
            materials: [],
            questionNumber: parseInt(formData.get('questionNumber')),
            timeLimit: parseInt(formData.get('timeLimit')),
            isPrivate: formData.get('visibility') === 'private',
            isStatic: formData.get('contentType') === 'static',
            defaultQuestionType: formData.get('defaultQuestionType')
        };

        try {
            const response = await fetch('/api/quizzes', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify(quizData)
            });

            if (!response.ok) {
                let errorText = '������';
                try {
                    const error = await response.text();
                    try {
                        const errorJson = JSON.parse(error);
                        errorText = errorJson.message || errorJson.error || errorText;
                    } catch (e) {
                        errorText = error;
                    }
                } catch (e) {
                    errorText = '������ : ' + response.status;
                }
                if (response.status === 400 && (errorText.includes('�������') || errorText.includes('����������'))) {
                    alert('������ ��� �������� ����� �������� ����������');
                } else if (errorText.includes('�������') || errorText.includes('����������') || errorText.includes('UNETHICAL_PROMPT')) {
                    alert('������ ��� �������� ����� �������� ����������');
                } else {
                    errorMessage.textContent = '������ ��� �������� �����: ' + errorText;
                    errorMessage.classList.add('show');
                }
                return;
            }

            const result = await response.json();
            const quizId = result.id ?? result.quizId;

            if (fileInput.files.length > 0 && fileInput.files[0].size > 0) {
                const fileFormData = new FormData();
                fileFormData.append('files', fileInput.files[0]);
                const materialsStatus = await fetch('/api/quizzes/' + quizId + '/materials', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: fileFormData
                });
                if(!materialsStatus.ok){
                    alert('������ ��� �������� �����');
                    return;
                }
            }

            alert('Квиз успешно создан!');
            window.location.href = '/my-quizzes';
        } catch (error) {
            errorMessage.textContent = '������ ����.';
            errorMessage.classList.add('show');
            console.error('Error:', error);
        }
    }
</script>
</body>
</html>
