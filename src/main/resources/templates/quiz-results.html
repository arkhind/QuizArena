<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты квиза</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
        }

        .sidebar {
            display: none;
        }

        .nav-btn {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 15px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            transition: all 0.3s;
            margin-bottom: 15px;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .nav-btn:hover {
            background: #667eea;
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            margin-left: 0;
            max-width: 100%;
        }

        .container {
            max-width: none;
            width: 100%;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            text-align: center;
            margin: 0;
        }

        .content-section {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .score-display {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            margin-bottom: 30px;
        }

        .score-value {
            font-size: 4em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .score-label {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .result-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #e9ecef;
            text-align: center;
        }

        .result-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .leaderboard-section {
            background: #fff;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
        }

        .leaderboard-title {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .leaderboard-subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table thead {
            background: #f8f9fa;
        }

        .leaderboard-table th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #e9ecef;
            color: #333;
        }

        .leaderboard-table td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
        }

        .leaderboard-table tbody tr:hover {
            background: #f8f9fa;
        }

        .rank {
            font-weight: bold;
            font-size: 1.2em;
            color: #667eea;
            text-align: center;
            width: 60px;
            display: inline-block;
        }

        .rank.first {
            color: #ffd700;
        }

        .rank.second {
            color: #c0c0c0;
        }

        .rank.third {
            color: #cd7f32;
        }

        .player-name {
            font-weight: 500;
            color: #333;
        }

        .player-score {
            color: #666;
            font-weight: bold;
        }

        .player-time {
            color: #999;
            font-size: 0.9em;
        }

        .user-row {
            background: #f0f4ff;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }


        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: nowrap;
        }

        button {
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
        }

        .leaderboard-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .home-btn {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }

        @media (max-width: 900px) {
            .sidebar {
                position: relative;
                width: 100%;
                margin-bottom: 20px;
            }

            .main-content {
                margin-left: 0;
                max-width: 100%;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .leaderboard-table {
                font-size: 14px;
            }

            .leaderboard-table th,
            .leaderboard-table td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<div class="sidebar">
    <a href="/home" class="nav-btn">Главная</a>
    <a href="/quiz" class="nav-btn">Все квизы</a>
</div>

<div class="main-content">
    <div class="container">
        <input type="hidden" id="activeAttemptIdInput" th:value="${activeAttemptId}">
        <input type="hidden" id="resultUserId" th:value="${userId}">
        <header class="header">
            <h1 th:text="${quizName != null ? quizName : 'Результаты квиза'}">Результаты квиза</h1>
        </header>

        <div class="content-section">
            <div class="score-display">
                <div class="score-value" th:text="${score != null ? score : 0}"></div>
                <div class="score-label">Ваш результат</div>
                <div class="position-badge" th:if="${position != null}">
                    Место: <span th:text="${position}">-</span>
                </div>
            </div>

            <div class="results-grid">
                <div class="result-item">
                    <div class="result-label">Правильных ответов</div>
                    <div class="result-value" th:text="${correctAnswers != null ? correctAnswers : 0}"></div>
                    <div class="result-label" th:if="${totalQuestions != null}" th:text="'из ' + ${totalQuestions}">из </div>
                </div>
                <div class="result-item">
                    <div class="result-label">Всего вопросов</div>
                    <div class="result-value" th:text="${totalQuestions != null ? totalQuestions : 0}"></div>
                </div>
            </div>

            <div class="leaderboard-section">
                <div class="leaderboard-title">Таблица лидеров</div>
                <div class="leaderboard-subtitle" th:text="${quizName != null ? quizName : ''}">Название квиза</div>

                <table class="leaderboard-table" th:if="${leaderboard != null and leaderboard.entries() != null and !leaderboard.entries().isEmpty()}">
                    <thead>
                    <tr>
                        <th>Место</th>
                        <th>Игрок</th>
                        <th>Результат</th>
                        <th>Время</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="entry : ${leaderboard.entries()}"
                        th:classappend="${userPosition != null and entry.position() != null and entry.position().equals(userPosition)} ? 'user-row' : ''">
                        <td>
                            <span class="rank"
                                  th:classappend="${entry.position() != null and entry.position() == 1} ? 'first' : (${entry.position() != null and entry.position() == 2} ? 'second' : (${entry.position() != null and entry.position() == 3} ? 'third' : ''))"
                                  th:text="${entry.position()}"></span>
                        </td>
                        <td class="player-name" th:text="${entry.username()}"></td>
                        <td class="player-score" th:text="${entry.score()}"></td>
                        <td class="player-time" th:text="${entry.timeSpent() != null ? entry.timeSpent() + ' сек' : '-'}"></td>
                    </tr>
                    </tbody>
                </table>

                <div class="empty-state" th:if="${leaderboard == null or leaderboard.entries() == null or leaderboard.entries().isEmpty()}">
                    <h3>Таблица лидеров пуста</h3>
                </div>
            </div>

            <div class="button-group">
                <button class="leaderboard-btn" onclick="startQuizAgain()">Пройти ещё раз</button>
                <button class="home-btn" onclick="goHome()">На главную</button>
            </div>
        </div>
    </div>
</div>

<script>
    function getQuizId() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('quizId');
    }

    function viewLeaderboard() {
        const quizId = getQuizId();
        const userId = localStorage.getItem('userId') || '1';
        if (quizId) {
            window.location.href = '/quiz/' + quizId + '/leaderboard?userId=' + userId;
        }
    }

    function startQuizAgain() {
        const quizId = getQuizId();
        const activeAttemptId = document.getElementById('activeAttemptIdInput')?.value;
        const userId = document.getElementById('resultUserId')?.value || localStorage.getItem('userId');

        if (!quizId || !userId) {
            window.location.href = '/login';
            return;
        }

        const userIdNum = parseInt(userId, 10);
        if (isNaN(userIdNum) || userIdNum <= 0) {
            window.location.href = '/login';
            return;
        }

        if (activeAttemptId) {
            const shouldResume = confirm('У вас есть незавершённая попытка. Нажмите OK, чтобы продолжить, или Отмена, чтобы начать заново.');
            if (shouldResume) {
                window.location.href = '/quiz/' + quizId + '/attempt?userId=' + userIdNum + '&mode=resume';
                return;
            }

            const shouldRestart = confirm('Начать новую попытку? Прошлая незавершённая попытка будет завершена.');
            if (!shouldRestart) {
                return;
            }

            window.location.href = '/quiz/' + quizId + '/attempt?userId=' + userIdNum + '&mode=restart';
            return;
        }

        window.location.href = '/quiz/' + quizId + '/attempt?userId=' + userIdNum;
    }

    function goHome() {
        window.location.href = '/home';
    }
</script>
</body>
</html>
