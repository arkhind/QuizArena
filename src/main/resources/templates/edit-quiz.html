<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование квиза</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: white;
            padding: 25px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            height: 200px;
            position: fixed;
            left: 20px;
            top: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
        }

        .nav-btn {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 15px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;
            width: 100%;
            transition: all 0.3s;
            margin-bottom: 15px;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .nav-btn:hover {
            background: #667eea;
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            margin-left: 340px;
            max-width: calc(100vw - 360px);
        }

        .container {
            max-width: none;
            width: 100%;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            text-align: center;
            margin: 0;
        }

        .form-container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-size: 16px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .required {
            color: #e74c3c;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .file-upload-section {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }


        .file-upload-label {
            display: block;
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .file-upload-icon {
            font-size: 40px;
            color: #667eea;
            margin-bottom: 10px;
        }

        input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .number-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .quiz-type-section {
            margin-top: 20px;
        }

        .type-category {
            margin-bottom: 20px;
        }

        .type-category-label {
            font-weight: bold;
            color: #555;
            margin-bottom: 12px;
            display: block;
        }

        .radio-group {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .radio-option label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .btn-small {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-remove {
            background: #dc3545;
            color: white;
        }

        .btn-remove:hover {
            background: #c82333;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 40px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .cancel-btn {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .cancel-btn:hover {
            background: #667eea;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        @media (max-width: 900px) {
            .sidebar {
                position: relative;
                width: 100%;
                margin-bottom: 20px;
            }

            .main-content {
                margin-left: 0;
                max-width: 100%;
            }

            .number-inputs {
                grid-template-columns: 1fr;
            }

            .radio-group {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
<div class="sidebar">
    <a href="/my-quizzes" class="nav-btn" onclick="event.preventDefault(); goBack()">Назад</a>
    <a href="/home" class="nav-btn">Главная</a>
</div>

<div class="main-content">
    <div class="container">
        <header class="header">
            <h1 th:text="'Редактирование: ' + ${quizName}">Редактирование квиза</h1>
        </header>

        <div class="form-container">
            <form id="editQuizForm" onsubmit="handleSubmit(event)">
                <!-- Скрытые поля для ID -->
                <input type="hidden" id="quizId" th:value="${quizId}">
                <input type="hidden" id="userId" th:value="${userId}">

                <!-- Название квиза -->
                <div class="form-group">
                    <label>
                        <span class="required">*</span> Название квиза:
                    </label>
                    <input type="text"
                           id="quizName"
                           name="name"
                           th:value="${quizName}"
                           required
                           minlength="3"
                           maxlength="100">
                </div>

                <div class="form-group">
                    <label>
                        <span class="required">*</span> Описание (промпт для ИИ):
                    </label>
                    <textarea id="quizDescription"
                              name="description"
                              th:text="${description}"
                              required
                              minlength="10"
                              maxlength="500"></textarea>
                </div>

                <div class="form-group">
                    <div class="file-upload-section" onclick="document.getElementById('quizMaterial').click()">
                        <div class="file-upload-icon">📄</div>
                        <span class="file-upload-label" id="fileLabel">
                                Добавить новый материал (.pdf, .txt, .doc, .docx)
                            </span>
                        <small style="color: #999; display: block; margin-top: 10px;">
                            Необязательно. Новый материал добавится к существующим
                        </small>
                        <div class="file-input-wrapper">
                            <input type="file"
                                   id="quizMaterial"
                                   name="material"
                                   accept=".pdf,.txt,.doc,.docx"
                                   style="display: none;">
                        </div>
                    </div>
                </div>

                <div class="number-inputs">
                    <div class="form-group">
                        <label>
                            <span class="required">*</span> Количество вопросов:
                        </label>
                        <input type="number"
                               id="questionNumber"
                               name="questionNumber"
                               th:value="${quiz != null and quiz.questionNumber != null ? quiz.questionNumber : 10}"
                               min="1"
                               max="200"
                               required>
                        <small style="color: #666; display: block; margin-top: 5px;">
                            Максимум 30 вопросов (из 200 доступных в базе данных)
                        </small>
                    </div>

                    <div class="form-group">
                        <label>
                            <span class="required">*</span> Время на ответ (сек):
                        </label>
                        <input type="number"
                               id="timeLimit"
                               name="timeLimit"
                               th:value="${timeLimit}"
                               min="10"
                               max="300"
                               required>
                    </div>
                </div>

                <div class="form-group quiz-type-section">
                    <label>
                        <span class="required">*</span> Настройки квиза:
                    </label>

                    <div class="type-category">
                        <span class="type-category-label">1. Видимость:</span>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio"
                                       id="public"
                                       name="visibility"
                                       value="public"
                                       th:checked="${isPublic == true}">
                                <label for="public">Публичный</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio"
                                       id="private"
                                       name="visibility"
                                       value="private"
                                       th:checked="${isPublic == false}">
                                <label for="private">Приватный</label>
                            </div>
                        </div>
                    </div>

                    <div class="type-category">
                        <span class="type-category-label">2. Тип содержимого:</span>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio"
                                       id="static"
                                       name="contentType"
                                       value="static"
                                       th:checked="${isStatic == true}">
                                <label for="static">Статичный</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio"
                                       id="updatable"
                                       name="contentType"
                                       value="updatable"
                                       th:checked="${isStatic == false}">
                                <label for="updatable">Обновляемый</label>
                            </div>
                        </div>
                    </div>

                    <!-- defaultQuestionType-->
                    <div class="type-category">
                        <span class="type-category-label">3. Тип вопросов:</span>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" id="editDefSingle" name="defaultQuestionType" value="SINGLE_CHOICE"
                                       th:checked="${quiz.defaultQuestionType == null or quiz.defaultQuestionType.name() == 'SINGLE_CHOICE'}">
                                <label for="editDefSingle">Одиночный выбор</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="editDefMulti" name="defaultQuestionType" value="MULTIPLE_CHOICE"
                                       th:checked="${quiz.defaultQuestionType != null and quiz.defaultQuestionType.name() == 'MULTIPLE_CHOICE'}">
                                <label for="editDefMulti">Множественный выбор</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" id="editHundredToOne" name="defaultQuestionType" value="HUNDRED_TO_ONE"
                                       th:checked="${quiz.defaultQuestionType != null and quiz.defaultQuestionType.name() == 'HUNDRED_TO_ONE'}">
                                <label for="editHundredToOne">Множественный выбор</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="button" class="cancel-btn" onclick="goBack()">
                        Отмена
                    </button>
                    <button type="button" class="delete-btn" onclick="deleteQuiz()">
                        Удалить квиз
                    </button>
                    <button type="submit" class="submit-btn">
                        Сохранить изменения
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    /**
     * Возврат на страницу "Мои квизы".
     * Получает userId из скрытого поля или localStorage.
     */
    function goBack() {
        const userId = getCurrentUserId();
        window.location.href = '/my-quizzes?userId=' + userId;
    }

    /**
     * Получение ID текущего пользователя.
     * Сначала проверяет скрытое поле формы, затем localStorage, затем query параметры.
     *
     * @returns {string} ID пользователя
     */
    function getCurrentUserId() {
        // Пробуем получить из скрытого поля формы
        const formUserId = document.getElementById('userId')?.value;
        if (formUserId) {
            return formUserId;
        }

        // Пробуем получить из localStorage
        const storedUserId = localStorage.getItem('userId');
        if (storedUserId) {
            return storedUserId;
        }

        // Пробуем получить из URL параметров
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('userId');
        if (urlUserId) {
            return urlUserId;
        }

        // Дефолтное значение
        return '1';
    }

    /**
     * Получение ID квиза из скрытого поля формы.
     *
     * @returns {string} ID квиза
     */
    function getQuizId() {
        return document.getElementById('quizId').value;
    }

    /**
     * Обработка отправки формы редактирования квиза.
     * Собирает данные формы, валидирует их и отправляет на сервер через REST API.
     *
     * @param {Event} event - событие отправки формы
     */
    async function handleSubmit(event) {
        event.preventDefault(); // Предотвращаем стандартную отправку формы

        const form = document.getElementById('editQuizForm');
        const formData = new FormData(form);

        // Собираем данные формы в объект для отправки
        const quizData = {
            quizId: parseInt(getQuizId()),
            userId: parseInt(getCurrentUserId()),
            name: formData.get('name').trim(),
            prompt: formData.get('description').trim(), // description -> prompt для соответствия DTO
            questionNumber: parseInt(formData.get('questionNumber')),
            timeLimit: parseInt(formData.get('timeLimit')),
            isPrivate: formData.get('visibility') === 'private',
            isStatic: formData.get('contentType') === 'static',
            defaultQuestionType: formData.get('defaultQuestionType')
        };

        try {
            // Получаем токен авторизации из localStorage
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Вы не авторизованы');
                window.location.href = '/login';
                return;
            }


            const response = await fetch('/api/quizzes/' + getQuizId(), {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(quizData)
            });


            if (response.ok) {
                const result = await response.json();
                alert('Квиз успешно обновлен!');
                window.location.href = '/my-quizzes?userId=' + getCurrentUserId();
            } else {
                let errorText = '';
                try {
                    const error = await response.text();
                    try {
                        const errorJson = JSON.parse(error);
                        errorText = errorJson.message || errorJson.error || `Ошибка ${response.status}: ${response.statusText}`;
                    } catch (e) {
                        errorText = error || `Ошибка ${response.status}: ${response.statusText}`;
                    }
                } catch (e) {
                    errorText = `Ошибка ${response.status}: ${response.statusText}`;
                }
                
                // Проверяем, является ли ошибка связанной с неэтичным промптом
                if (errorText.includes('неэтичн') || errorText.includes('неэтичными')) {
                    alert('Данные для создания квиза являются неэтичными');
                } else {
                    alert('Ошибка при обновлении квиза: ' + errorText);
                }
            }
        } catch (error) {

            console.error('Error:', error);
            alert('Ошибка сети');
        }
    }


    async function deleteQuiz() {

        if (!confirm('Вы уверены, что хотите удалить этот квиз? Это действие нельзя отменить.')) {
            return;
        }

        try {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('Вы не авторизованы');
                return;
            }


            const response = await fetch('/api/quizzes/' + getQuizId() + '?userId=' + getCurrentUserId(), {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    quizId: parseInt(getQuizId()),
                    userId: parseInt(getCurrentUserId())
                })
            });

            if (response.ok) {
                alert('Квиз удален');
                window.location.href = '/my-quizzes?userId=' + getCurrentUserId();
            } else {
                const error = await response.json().catch(() => ({}));
                const errorMessage = error.message || error.error ||
                                   `Ошибка ${response.status}: ${response.statusText}`;
                alert('Ошибка при удалении квиза: ' + errorMessage);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Ошибка сети. Проверьте подключение к интернету.');
        }
    }

    /**
     * Обновление текста метки после выбора файла.
     * Показывает имя загруженного файла вместо стандартного текста.
     *
     * @param {string} fileName - имя выбранного файла
     */
    function updateFileLabel(fileName) {
        const label = document.getElementById('fileLabel');
        label.textContent = 'Файл загружен: ' + fileName;
    }
    const fileInput = document.getElementById('quizMaterial');


    /**
     * Обработчик изменения файла через стандартный выбор.
     * Срабатывает при клике на "Выбрать файл" в диалоге.
     */
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            updateFileLabel(e.target.files[0].name);
        } else {
            // Если файл удален, возвращаем исходный текст
            const label = document.getElementById('fileLabel');
            label.textContent = 'Добавить новый материал (.pdf, .txt, .doc, .docx)';
            label.style.color = '#666';
            label.style.fontWeight = 'normal';
        }
    });
</script>
</body>
</html>
