<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница квиза</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .quiz-meta-card {
            background: white;
            border-radius: 12px;
            padding: 18px 22px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px 18px;
        }

        .quiz-meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #2c3e50;
            font-size: 1rem;
            font-weight: 600;
            min-width: 0;
        }

        .quiz-meta-item svg {
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
            color: #667eea;
        }

        .quiz-meta-label {
            color: #7f8c8d;
            font-weight: 500;
            margin-right: 4px;
        }

        .quiz-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .actions, .leaderboard {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .actions h2, .leaderboard h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 1.5rem;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 10px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
        }

        .btn-secondary {
            background: #f0f2f5;
            color: #2c3e50;
        }

        .leaderboard-list {
            list-style: none;
        }

        .leaderboard-item {
            padding: 15px;
            border-bottom: 1px solid #f0f2f5;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .leaderboard-item.you {
            background-color: #e8f4ff;
            border-radius: 8px;
            font-weight: 600;
            color: #2575fc;
        }

        .rank {
            width: 30px;
            height: 30px;
            background: #f0f2f5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .rank.first {
            background: #ffd700;
            color: white;
        }

        .rank.second {
            background: #c0c0c0;
            color: white;
        }

        .rank.third {
            background: #cd7f32;
            color: white;
        }

        .leaderboard-item.you .rank {
            background: #2575fc;
            color: white;
        }

        .player-info {
            flex-grow: 1;
        }

        .player-name {
            font-weight: 600;
        }

        .player-score {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .error-message {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .warning-message {
            background-color: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
    <link rel="stylesheet" href="/css/theme.css?v=6" onerror="this.onerror=null;this.href='../static/css/theme.css?v=6';">
</head>
<body>
<div th:replace='~{fragments/sidebar :: sidebar}'></div>

<div class="main-content">
<div class="container">
    <div th:if="${errorMessage != null}" class="error-message" th:text="${errorMessage}"></div>
    <div th:if="${hasQuestions != null and !hasQuestions}" class="warning-message">
        В этом квизе пока нет вопросов. Попробуйте позже.
    </div>
    
    <header>
        <h1 th:text="${quizzes != null and !quizzes.isEmpty() ? quizzes[0].name : 'Квиз'}">Название квиза</h1>
    </header>

    <section class="quiz-meta-card" th:if="${quizzes != null and !quizzes.isEmpty()}">
        <div class="quiz-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            <span><span class="quiz-meta-label">Автор:</span><span th:text="${quizzes[0].author != null ? quizzes[0].author : '-'}">-</span></span>
        </div>
        <div class="quiz-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span><span class="quiz-meta-label">Вопросов:</span><span th:text="${quizzes[0].questionCount != null ? quizzes[0].questionCount : 0}">0</span></span>
        </div>
        <div class="quiz-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <span><span class="quiz-meta-label">Время:</span><span th:text="${quizzes[0].timePerQuestion != null and quizzes[0].timePerQuestion > 0 ? quizzes[0].timePerQuestion + ' сек на вопрос' : 'не ограничено'}">-</span></span>
        </div>
        <div class="quiz-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
            <span><span class="quiz-meta-label">Тип:</span><span th:text="${quizzes[0].isStatic != null ? (quizzes[0].isStatic ? 'статичный' : 'обновляемый') : '-'}">-</span></span>
        </div>
        <div class="quiz-meta-item">
            <svg th:if="${quizzes[0].isPublic == null or quizzes[0].isPublic}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 0 20"/><path d="M12 2a15.3 15.3 0 0 0 0 20"/></svg>
            <svg th:if="${quizzes[0].isPublic != null and !quizzes[0].isPublic}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span><span class="quiz-meta-label">Видимость:</span><span th:text="${quizzes[0].isPublic != null ? (quizzes[0].isPublic ? 'публичный' : 'приватный') : '-'}">-</span></span>
        </div>
    </section>

    <div class="quiz-content">
        <div class="actions">
            <h2>Действия</h2>
            <div class="action-buttons">
                <button class="btn btn-primary"
                        th:if="${quizzes != null and !quizzes.isEmpty() and hasQuestions != null and hasQuestions and (sessionId == null or isMultiplayerHost == true)}"
                        onclick="startQuiz(getQuizId())"
                        th:onclick="'startQuiz(' + ${quizzes[0].id} + ')'">Начать квиз</button>
                <button class="btn btn-primary"
                        th:if="${quizzes != null and !quizzes.isEmpty() and (hasQuestions == null or !hasQuestions) and (sessionId == null or isMultiplayerHost == true)}"
                        disabled>Начать квиз</button>
                <button class="btn btn-primary"
                        th:if="${quizzes != null and !quizzes.isEmpty() and hasQuestions != null and hasQuestions}"
                        style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);"
                        onclick="startMultiplayer(getQuizId())"
                        th:onclick="'startMultiplayer(' + ${quizzes[0].id} + ')'">Начать мультиплеер</button>
                <button class="btn btn-secondary"
                        th:if="${quizzes != null and !quizzes.isEmpty()}"
                        onclick="copyQuiz(getQuizId())"
                        th:onclick="'copyQuiz(' + ${quizzes[0].id} + ')'">Скопировать квиз</button>
            </div>
        </div>

        <div class="leaderboard">
            <h2>Таблица лидеров</h2>
            <ul class="leaderboard-list" th:if="${leaderboard != null and leaderboard.entries() != null and !leaderboard.entries().isEmpty()}">
                <li th:each="entry : ${leaderboard.entries()}"
                    th:classappend="${leaderboard.userPosition() != null and entry.position() != null and entry.position().equals(leaderboard.userPosition())} ? 'you' : ''">
                    <div class="rank"
                         th:classappend="${entry.position() != null and entry.position() == 1} ? 'first' : (${entry.position() != null and entry.position() == 2} ? 'second' : (${entry.position() != null and entry.position() == 3} ? 'third' : ''))"
                         th:text="${entry.position()}"></div>
                    <div class="player-info">
                        <div class="player-name" th:text="${entry.username()}">User</div>
                        <div class="player-score"
                             th:text="${entry.score() + ' очков · точность ' + (entry.accuracyPercent() != null ? entry.accuracyPercent() : 0) + '%'}">- очков · точность -</div>
                    </div>
                </li>
            </ul>
            <div class="empty-state" th:if="${leaderboard == null or leaderboard.entries() == null or leaderboard.entries().isEmpty()}">
                <p>Таблица лидеров пуста</p>
                <p style="font-size: 0.9em; margin-top: 10px;">Ещё никто не прошёл этот квиз</p>
            </div>
        </div>
    </div>
</div>
</div>

<script th:inline="javascript">
    const pageQuizId = /*[[${quizId}]]*/ null;
    const activeAttemptId = /*[[${activeAttemptId}]]*/ null;

    function getQuizId() {
        if (pageQuizId != null && pageQuizId !== '') {
            return String(pageQuizId);
        }
        // Получаем quizId из пути URL (/quiz/{quizId})
        const path = window.location.pathname;
        const match = path.match(/\/quiz\/(\d+)/);
        if (match) {
            return match[1];
        }
        // Если не нашли в пути, берём из query-параметров
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('quizId');
    }

    function startQuiz(quizId) {
        if (!quizId) {
            window.location.href = '/quiz';
            return;
        }
        
        if (activeAttemptId) {
            const shouldResume = confirm("У вас есть незавершённая попытка. Нажмите OK, чтобы продолжить, или Отмена, чтобы начать заново.");
            if (shouldResume) {
                window.location.href = "/quiz/" + quizId + "/attempt";
                return;
            }
            const shouldRestart = confirm("Начать новую попытку? Прошлая незавершённая попытка будет завершена.");
            if (!shouldRestart) {
                return;
            }
            submitRestartAttempt(quizId);
            return;
        }
        
        window.location.href = "/quiz/" + quizId + "/attempt";
    }

    function submitRestartAttempt(quizId) {
        if (!quizId) {
            window.location.href = '/quiz';
            return;
        }
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/quiz/' + quizId + '/attempt/restart';
        document.body.appendChild(form);
        form.submit();
    }

    function copyQuiz(quizId) {
        alert('Функция копирования квиза будет реализована позже');
    }

    function startMultiplayer(quizId) {
        if (!quizId) {
            window.location.href = '/quiz';
            return;
        }
        window.location.href = '/multiplayer/create?quizId=' + quizId;
    }

</script>
<script src="/js/sidebar.js?v=5" onerror="this.onerror=null;this.src='../static/js/sidebar.js?v=5';"></script>
</body>
</html>
