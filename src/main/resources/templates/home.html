<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница - QuizArena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: white;
            padding: 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            height: 30vh;
            position: fixed;
            left: 40px;
            top: 40px;
            border-radius: 10px;
        }

        .profile-section {
            margin-bottom: 30px;
        }

        .profile-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: transform 0.2s;
            margin-bottom: 10px;
        }

        .nav-btn {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
            margin-bottom: 10px;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .nav-btn:hover {
            background: #667eea;
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            margin-left: 320px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header h1 {
            text-align: center;
            color: #333;
            font-size: 2.5em;
        }
        .header h2 {
            text-align: center;
            color: #333;
            font-size: 1.5em;
        }

        .search-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-box {
            display: flex;
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #667eea;
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .public-quizzes {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 300px;
        }

        .public-quizzes h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
            text-align: center;
        }

        .quiz-list {
            list-style: none;
        }

        .quiz-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quiz-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .quiz-meta {
            font-size: 14px;
            opacity: 0.8;
            display: flex;
            gap: 15px;
        }

        .empty-state {
            text-align: center;
            color: #666;
            font-size: 20px;
            margin-top: 50px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .page-btn {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .logout-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        @media (max-width: 900px) {
            body {
                display: block;
            }
            .sidebar {
                position: relative;
                width: calc(100% - 48px);
                left: 24px;
                top: 24px;
                height: auto;
                margin-bottom: 0;
            }
            .main-content {
                margin-left: 0;
                padding: 16px 24px 24px;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/theme.css?v=3" onerror="this.onerror=null;this.href='../static/css/theme.css?v=3';">
</head>
<body data-active-nav="home">
<aside class="sidebar">
    <a href="/home" class="brand">
        <span class="brand-text">QuizArena</span>
    </a>
    <nav class="sidebar-nav">
        <a href="/home" class="nav-btn" data-nav="home">
            <span class="nav-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg></span>
            <span>Главная</span>
        </a>
        <a href="#" class="nav-btn" data-nav="my-quizzes">
            <span class="nav-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span>
            <span>Мои квизы</span>
        </a>
        <a href="#" class="nav-btn" data-nav="history">
            <span class="nav-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
            <span>История</span>
        </a>
        <a href="#" class="nav-btn" data-nav="profile">
            <span class="nav-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>
            <span>Профиль</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <a href="#" class="user-card" data-nav="profile">
            <span class="user-avatar" data-user-avatar>?</span>
            <span class="user-name" data-user-name>Гость</span>
        </a>
    </div>
</aside>

<div class="main-content">
    <div class="container">
        <header class="header">
            <h1>QuizArena</h1>
            <h2>Главная страница</h2>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск квизов..." th:value="${search}">
                <button class="search-btn" onclick="performSearch()">Найти</button>
            </div>
        </section>

        <section class="public-quizzes">
            <h2>Публичные Квизы</h2>
            <ul class="quiz-list" th:if="${quizzes != null and !quizzes.isEmpty()}">
                <li class="quiz-item" th:each="quiz : ${quizzes}" th:onclick="'goToQuiz(' + ${quiz.id} + ')'">
                    <div class="quiz-name" th:text="${quiz.name}">Название квиза</div>
                    <div class="quiz-meta">
                        <span th:text="'Автор: ' + ${quiz.author}">Автор</span>
                        <span th:text="'Вопросов: ' + ${quiz.questionCount}">Вопросов</span>
                        <span th:if="${quiz.timePerQuestion != null and quiz.timePerQuestion > 0}" 
                              th:text="'Время: ' + ${quiz.timePerQuestion} + ' сек'">Время</span>
                        <span th:if="${quiz.timePerQuestion == null or quiz.timePerQuestion == 0}">Время: не ограничено</span>
                    </div>
                </li>
            </ul>
            <div class="pagination" th:if="${totalPages > 1}">
                <button class="page-btn" th:each="page : ${#numbers.sequence(1, totalPages)}"
                        th:classappend="${page == currentPage + 1 ? 'active' : ''}"
                        th:onclick="'goToPage(' + ${page - 1} + ')'"
                        th:text="${page}">1</button>
            </div>
        </section>
    </div>
</div>

<script>
    function goToProfile() {
        const userId = localStorage.getItem('userId');
        if (userId) {
            window.location.href = '/profile?userId=' + userId;
        } else {
            window.location.href = '/login';
        }
    }

    function goToQuiz(quizId) {
        window.location.href = '/quiz/' + quizId;
    }

    function performSearch() {
        const searchTerm = document.getElementById('searchInput').value;
        window.location.href = '/home?search=' + encodeURIComponent(searchTerm);
    }

    function goToPage(page) {
        const searchTerm = document.getElementById('searchInput').value;
        window.location.href = '/home?search=' + encodeURIComponent(searchTerm) + '&page=' + page;
    }

    // Поиск по Enter
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            performSearch();
        }
    });


</script>
<script src="/js/sidebar.js?v=3" onerror="this.onerror=null;this.src='../static/js/sidebar.js?v=3';"></script>
</body>
</html>
