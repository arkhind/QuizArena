<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница - QuizArena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: white;
            padding: 20px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            height: 30vh;
            position: fixed;
            left: 40px;
            top: 40px;
            border-radius: 10px;
        }

        .profile-section {
            margin-bottom: 30px;
        }

        .profile-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: transform 0.2s;
            margin-bottom: 10px;
        }

        .nav-btn {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s;
            margin-bottom: 10px;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .nav-btn:hover {
            background: #667eea;
            color: white;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            margin-left: 320px;
        }

        .container {
            max-width: none;
            width: 100%;
        }

        .header {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header h1 {
            text-align: center;
            color: #333;
            font-size: 2.5em;
        }
        .header h2 {
            text-align: center;
            color: #333;
            font-size: 1.5em;
        }

        .search-section {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .search-box {
            display: flex;
            gap: 10px;
            max-width: 620px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #667eea;
        }

        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .public-quizzes {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            min-height: 300px;
        }

        .public-quizzes h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8em;
            text-align: center;
        }

        .quiz-list {
            list-style: none;
        }

        .quiz-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quiz-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .quiz-meta {
            font-size: 14px;
            opacity: 0.8;
            display: flex;
            gap: 15px;
        }

        .empty-state {
            text-align: center;
            color: #666;
            font-size: 20px;
            margin-top: 50px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .page-btn {
            padding: 8px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
        }
@media (max-width: 900px) {
            body {
                display: block;
            }
            .sidebar {
                position: relative;
                width: calc(100% - 48px);
                left: 24px;
                top: 24px;
                height: auto;
                margin-bottom: 0;
            }
            .main-content {
                margin-left: 0;
                padding: 16px 24px 24px;
            }
        }
    </style>
    <link rel="stylesheet" href="/css/theme.css?v=8" onerror="this.onerror=null;this.href='../static/css/theme.css?v=8';">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body data-active-nav="home">
<div th:replace='~{fragments/sidebar :: sidebar}'></div>

<div class="main-content">
    <div class="container">
        <header class="header">
            <h1>QuizArena</h1>
            <h2>Главная страница</h2>
        </header>

        <section class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="Поиск квизов..." th:value="${search}">
                <button class="search-btn" onclick="performSearch()">Найти</button>
            </div>
        </section>

        <section class="public-quizzes">
            <div class="section-toolbar">
                <h2>Публичные Квизы</h2>
                <form class="sort-form" id="sortForm" method="get" action="/home">
                    <input type="hidden" name="search" id="sortSearchInput" th:value="${search}">
                    <input type="hidden" name="page" value="0">
                    <input type="hidden" name="ascending" id="ascendingInput" th:value="${ascending}">
                    <label class="sort-select-wrap">
                        <i data-lucide="list-filter" class="sort-filter-icon"></i>
                        <select class="sort-select" name="sortBy" onchange="submitSortForm()">
                            <option value="created" th:selected="${sortBy == 'created'}">Дата создания</option>
                            <option value="completions" th:selected="${sortBy == 'completions'}">Прохождения</option>
                            <option value="questions" th:selected="${sortBy == 'questions'}">Вопросы</option>
                        </select>
                    </label>
                    <button class="sort-direction-btn" type="button" onclick="toggleSortDirection()"
                            th:title="${ascending ? 'По возрастанию' : 'По убыванию'}">
                        <i th:attr="data-lucide=${ascending ? 'arrow-up-narrow-wide' : 'arrow-down-wide-narrow'}"></i>
                    </button>
                </form>
            </div>
            <ul class="quiz-list" th:if="${quizzes != null and !quizzes.isEmpty()}">
                <li class="quiz-item" th:each="quiz : ${quizzes}" th:onclick="'goToQuiz(' + ${quiz.id} + ')'">
                    <div class="quiz-card-main">
                        <div class="quiz-name" th:text="${quiz.name}">Название квиза</div>
                        <div class="quiz-meta">
                            <span th:text="'Автор: ' + ${quiz.author}">Автор</span>
                            <span th:text="'Вопросов: ' + ${quiz.questionCount}">Вопросов</span>
                            <span th:if="${quiz.timePerQuestion != null and quiz.timePerQuestion > 0}" 
                                  th:text="'Время: ' + ${quiz.timePerQuestion} + ' сек'">Время</span>
                            <span th:if="${quiz.timePerQuestion == null or quiz.timePerQuestion == 0}">Время: не ограничено</span>
                        </div>
                    </div>
                    <div class="quiz-attempts" aria-label="Количество прохождений">
                        <i data-lucide="users" class="quiz-attempts-icon"></i>
                        <span th:text="${quiz.completionCount != null ? quiz.completionCount : 0} + ' прохождений'">0 прохождений</span>
                    </div>
                </li>
            </ul>
            <div class="pagination" th:if="${totalElements != null and totalElements > 0}">
                <div class="pagination-summary"
                     th:text="'Показано ' + ${shownFrom} + '–' + ${shownTo} + ' из ' + ${totalElements} + ' ' + ${pageItemLabel}">
                    Показано 1–5 из 10 квизов
                </div>
                <div class="pagination-controls" th:if="${totalPages > 1}">
                    <span class="page-btn disabled" th:if="${currentPage == 0}" aria-disabled="true">← Назад</span>
                    <button class="page-btn" th:if="${currentPage > 0}"
                            th:onclick="'goToPage(' + ${currentPage - 1} + ')'">← Назад</button>
                    <button class="page-btn" th:each="page : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${page == currentPage + 1 ? 'active' : ''}"
                            th:onclick="'goToPage(' + ${page - 1} + ')'"
                            th:text="${page}">1</button>
                    <button class="page-btn" th:if="${currentPage + 1 < totalPages}"
                            th:onclick="'goToPage(' + ${currentPage + 1} + ')'">Вперёд →</button>
                    <span class="page-btn disabled" th:if="${currentPage + 1 >= totalPages}" aria-disabled="true">Вперёд →</span>
                </div>
            </div>
        </section>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        if (window.lucide) {
            window.lucide.createIcons();
        }
    });

    function goToProfile() {
        window.location.href = '/profile';
    }

    function goToQuiz(quizId) {
        window.location.href = '/quiz/' + quizId;
    }

    function performSearch() {
        const searchTerm = document.getElementById('searchInput').value;
        const sortBy = document.querySelector('.sort-select').value;
        const ascending = document.getElementById('ascendingInput').value;
        window.location.href = '/home?search=' + encodeURIComponent(searchTerm)
            + '&sortBy=' + encodeURIComponent(sortBy)
            + '&ascending=' + encodeURIComponent(ascending);
    }

    function goToPage(page) {
        const searchTerm = document.getElementById('searchInput').value;
        const sortBy = document.querySelector('.sort-select').value;
        const ascending = document.getElementById('ascendingInput').value;
        window.location.href = '/home?search=' + encodeURIComponent(searchTerm)
            + '&page=' + page
            + '&sortBy=' + encodeURIComponent(sortBy)
            + '&ascending=' + encodeURIComponent(ascending);
    }

    function toggleSortDirection() {
        const input = document.getElementById('ascendingInput');
        input.value = input.value === 'true' ? 'false' : 'true';
        submitSortForm();
    }

    function submitSortForm() {
        document.getElementById('sortSearchInput').value = document.getElementById('searchInput').value;
        document.getElementById('sortForm').submit();
    }

    // Поиск по Enter
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            performSearch();
        }
    });


</script>
<script src="/js/sidebar.js?v=5" onerror="this.onerror=null;this.src='../static/js/sidebar.js?v=5';"></script>
</body>
</html>
